<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BEN 10: OMNITRIX POWER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Arial Black',sans-serif;touch-action:none}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0a2a,#1a0a2a,#2a0a1a);display:flex;flex-direction:column;align-items:center;justify-content:center}
#loading.hidden{display:none}
.omnitrix-load{width:120px;height:120px;border-radius:50%;border:8px solid transparent;border-top-color:#00ff00;border-right-color:#00ccff;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:18px;font-weight:900;background:linear-gradient(90deg,#00ff00,#00ccff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
#start-screen{position:fixed;inset:0;z-index:900;background:radial-gradient(ellipse at center,#1a1a4a 0%,#0a0a1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#start-screen.hidden{display:none!important}
.game-title{font-size:48px;font-weight:900;text-align:center;line-height:1.1;margin-bottom:6px;background:linear-gradient(135deg,#00ff00 0%,#00ccff 50%,#00ffff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(0,255,0,.3)}
.game-sub{font-size:16px;color:#00ccff;letter-spacing:3px;margin-bottom:30px;font-weight:700}
.start-btn{padding:16px 48px;border-radius:50px;border:3px solid #00ff00;background:rgba(0,255,0,.1);color:#fff;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 0 30px rgba(0,255,0,.3);transition:all .2s}
.start-btn:active{transform:scale(.95);box-shadow:0 0 50px rgba(0,255,0,.5)}
.alien-preview{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;max-width:350px}
.alien-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #333;background:rgba(255,255,255,.05)}
.how-to{font-size:12px;color:#888;text-align:center;line-height:1.6;max-width:280px;margin-top:16px}
#hud{position:fixed;top:0;left:0;right:0;z-index:100;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 14px 0;display:none}
#hud.show{display:block}
.hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hp-container{width:140px;height:14px;background:rgba(0,0,0,.6);border-radius:7px;border:1px solid #333;overflow:hidden}
.hp-fill{height:100%;width:100%;border-radius:6px;transition:width .3s,background .3s}
.score-display{font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(0,255,255,.5)}
.wave-display{font-size:14px;font-weight:700;color:#ffcc00;text-shadow:0 0 6px rgba(255,204,0,.4)}
.hud-aliens{display:flex;gap:6px;justify-content:center;margin-top:4px}
.hud-alien{width:36px;height:36px;border-radius:10px;border:2px solid #333;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.hud-alien.active{border-color:#00ff00;box-shadow:0 0 12px rgba(0,255,0,.4);transform:scale(1.15)}
.hud-alien.locked{opacity:.3}
#controls{position:fixed;bottom:0;left:0;right:0;z-index:100;height:200px;pointer-events:none;display:none}
#controls.show{display:block}
.joystick-base{position:absolute;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
.joystick-knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(0,255,0,.3);border:2px solid #00ff00;left:35px;top:35px;transition:transform .05s;box-shadow:0 0 12px rgba(0,255,0,.3)}
.action-buttons{position:absolute;bottom:30px;right:30px;display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto}
.omnitrix-btn{width:80px;height:80px;border-radius:50%;border:3px solid #00ff00;background:radial-gradient(circle,#001a00,#000);color:#00ff00;font-size:32px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 0 20px rgba(0,255,0,.3);transition:all .15s}
.omnitrix-btn:active{transform:scale(.9);box-shadow:0 0 40px rgba(0,255,0,.6)}
.attack-btn{width:64px;height:64px;border-radius:50%;border:2px solid #ff4444;background:rgba(255,68,68,.2);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 0 12px rgba(255,68,68,.3)}
.attack-btn:active{transform:scale(.88);background:rgba(255,68,68,.4)}
.jump-btn{width:56px;height:56px;border-radius:50%;border:2px solid #4488ff;background:rgba(68,136,255,.2);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.jump-btn:active{transform:scale(.88)}
#transform-flash{position:fixed;inset:0;z-index:800;background:radial-gradient(circle,rgba(0,255,0,.8),rgba(0,200,255,.4),transparent);display:none;pointer-events:none}
#transform-flash.show{display:block;animation:flashOut .8s ease forwards}
@keyframes flashOut{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.alien-name-popup{position:fixed;top:35%;left:50%;transform:translateX(-50%);z-index:850;font-size:28px;font-weight:900;text-shadow:0 0 20px currentColor;opacity:0;transition:all .3s;pointer-events:none;text-align:center}
.alien-name-popup.show{opacity:1;top:30%}
.alien-name-popup .sub{font-size:14px;opacity:.7;letter-spacing:2px}
#game-over{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center}
#game-over.show{display:flex}
.go-title{font-size:42px;font-weight:900;color:#ff3333;margin-bottom:16px;text-shadow:0 0 20px rgba(255,51,51,.5)}
.go-stats{font-size:16px;color:#aaa;margin-bottom:24px;text-align:center;line-height:2}
.go-retry{padding:14px 40px;border-radius:50px;border:3px solid #00ff00;background:rgba(0,255,0,.1);color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit}
.go-retry:active{transform:scale(.95)}
#wave-banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:700;font-size:36px;font-weight:900;color:#ffcc00;text-shadow:0 0 20px rgba(255,204,0,.6);opacity:0;pointer-events:none;text-align:center;transition:opacity .5s}
#wave-banner.show{opacity:1}
#wave-banner .sub{font-size:16px;color:#aaa}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="loading"><div class="omnitrix-load"></div><div class="load-text">BEN 10 OMNITRIX</div></div>
<div id="start-screen">
<div class="game-title">BEN 10<br>OMNITRIX POWER</div>
<div class="game-sub">★ ALIEN FORCE ★</div>
<div class="alien-preview"><div class="alien-icon" style="border-color:#00ccff">🧠</div><div class="alien-icon" style="border-color:#ff6600">🔥</div><div class="alien-icon" style="border-color:#ff0000">💪</div><div class="alien-icon" style="border-color:#0066ff">⚡</div><div class="alien-icon" style="border-color:#00ffaa">💎</div></div>
<button class="start-btn" id="start-btn">▶ PLAY</button>
<div class="how-to">التحكم: الجويستيك لتحرك، ⚔ للهجوم، 🛗 للقفز، 🟢 للتحويل<br>قاتل موجات الأعداء وابقى حي!</div>
</div>
<div id="hud"><div class="hud-top"><div><div class="hp-container"><div class="hp-fill" id="hp-bar"></div></div><div style="font-size:11px;color:#aaa;margin-top:2px">HP</div></div><div style="text-align:center"><div class="wave-display" id="wave-text">WAVE 1</div><div class="score-display" id="score-text">0</div></div><div style="text-align:right"><div style="font-size:11px;color:#aaa">ALIEN</div><div id="current-alien" style="font-size:16px;font-weight:900;color:#00ff00">BEN</div></div></div><div class="hud-aliens" id="hud-aliens"></div></div>
<div id="controls"><div class="joystick-base" id="joy-base"><div class="joystick-knob" id="joy-knob"></div></div><div class="action-buttons"><button class="omnitrix-btn" id="omni-btn">🟢</button><button class="attack-btn" id="attack-btn">⚔</button><button class="jump-btn" id="jump-btn">🛗</button></div></div>
<div id="transform-flash"></div>
<div class="alien-name-popup" id="alien-popup"></div>
<div id="wave-banner"></div>
<div id="game-over"><div class="go-title">GAME OVER</div><div class="go-stats" id="go-stats">Waves: 0 Score: 0</div><button class="go-retry" id="retry-btn">↻ RETRY</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var STATE={playing:false,gameOver:false,score:0,wave:1,hp:100,maxHp:100,alienIndex:-1,aliensUnlocked:1,transformCooldown:0,attackCooldown:0,alive:true,moveDir:{x:0,z:0},isJumping:false,velY:0,posY:0,gameTime:0};
var ALIENS=[
{name:'BEN',emoji:'🧑',color:0x44aa44,size:1.0,speed:5,hp:100,attackDmg:10,attackRange:3,attackCD:0.5,attackColor:0x44ff44,attackType:'melee',ability:'Punch'},
{name:'GREY MATTER',emoji:'🧠',color:0x00ccff,size:0.5,speed:7,hp:60,attackDmg:8,attackRange:4,attackCD:0.3,attackColor:0x00ffff,attackType:'beam',ability:'Smart Beam'},
{name:'HEATBLAST',emoji:'🔥',color:0xff6600,size:1.1,speed:4,hp:80,attackDmg:25,attackRange:8,attackCD:0.8,attackColor:0xff4400,attackType:'fireball',ability:'Fireball'},
{name:'FOUR ARMS',emoji:'💪',color:0xff0000,size:1.4,speed:3,hp:140,attackDmg:40,attackRange:3.5,attackCD:1.0,attackColor:0xff3333,attackType:'melee',ability:'Quadruple Smash'},
{name:'XLR8',emoji:'⚡',color:0x0066ff,size:0.9,speed:10,hp:70,attackDmg:15,attackRange:5,attackCD:0.25,attackColor:0x00aaff,attackType:'dash',ability:'Dash Strike'},
{name:'DIAMONDHEAD',emoji:'💎',color:0x00ffaa,size:1.0,speed:5,hp:90,attackDmg:20,attackRange:7,attackCD:0.6,attackColor:0x00ffcc,attackType:'crystal',ability:'Crystal Shards'}
];
var scene,camera,renderer,player,playerMesh,ground;
var enemies=[],projectiles=[],particles=[];
var clock=new THREE.Clock();

function initThree(){
scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a0a2a,0.012);
scene.background=new THREE.Color(0x0a0a2a);
camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
camera.position.set(0,15,20);
camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game-canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var amb=new THREE.AmbientLight(0x404060,0.6);scene.add(amb);
var sun=new THREE.DirectionalLight(0x8888ff,0.8);sun.position.set(20,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
var gGeo=new THREE.PlaneGeometry(100,100);
var gMat=new THREE.MeshStandardMaterial({color:0x1a1a2a,roughness:0.9});
ground=new THREE.Mesh(gGeo,gMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
var grid=new THREE.GridHelper(100,50,0x333355,0x222244);grid.position.y=0.01;scene.add(grid);
for(var i=0;i<40;i++){
var h=4+Math.random()*16,w=3+Math.random()*4,d=3+Math.random()*4;
var x=(Math.random()-0.5)*90,z=(Math.random()-0.5)*90;
if(Math.abs(x)<12&&Math.abs(z)<12)continue;
var bGeo=new THREE.BoxGeometry(w,h,d);
var bMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.6+Math.random()*0.1,0.3,0.15+Math.random()*0.1),roughness:0.8,metalness:0.2});
var b=new THREE.Mesh(bGeo,bMat);b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
}
for(var i=0;i<200;i++){
var starGeo=new THREE.SphereGeometry(0.15,4,4);
var starMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:Math.random()*0.8+0.2});
var star=new THREE.Mesh(starGeo,starMat);
star.position.set((Math.random()-0.5)*200,30+Math.random()*60,(Math.random()-0.5)*200);scene.add(star);
}
createPlayer();
}

function createPlayer(){
if(player)scene.remove(player);
var alien=ALIENS[Math.max(0,STATE.alienIndex)];
var s=alien.size;
player=new THREE.Group();
var bodyMat=new THREE.MeshStandardMaterial({color:alien.color,roughness:0.5,metalness:0.3,emissive:alien.color,emissiveIntensity:0.15});
var bodyGeo=new THREE.CylinderGeometry(0.3*s,0.3*s,1.0*s,8);
var body=new THREE.Mesh(bodyGeo,bodyMat);body.position.y=0.6*s;body.castShadow=true;player.add(body);
var headGeo=new THREE.SphereGeometry(0.35*s,8,8);
var head=new THREE.Mesh(headGeo,bodyMat);head.position.y=1.35*s;head.castShadow=true;player.add(head);
var eyeGeo=new THREE.SphereGeometry(0.08*s,4,4);
var eyeMat=new THREE.MeshBasicMaterial({color:0xffff00});
var eyeL=new THREE.Mesh(eyeGeo,eyeMat);eyeL.position.set(-0.12*s,1.4*s,0.25*s);player.add(eyeL);
var eyeR=eyeL.clone();eyeR.position.x=0.12*s;player.add(eyeR);
var armGeo=new THREE.CylinderGeometry(0.3*s,0.3*s,1.0*s,8);
if(alien.name==='FOUR ARMS'){
for(var s2 of [-1,1]){for(var a of [0.3,-0.3]){var arm=new THREE.Mesh(armGeo,bodyMat);arm.position.set(s2*(0.45*s),0.7*s,0);arm.rotation.z=s2*(Math.PI/2+a);arm.castShadow=true;player.add(arm);}}
}else{for(var s2 of [-1,1]){var arm=new THREE.Mesh(armGeo,bodyMat);arm.position.set(s2*(0.4*s),0.7*s,0);arm.rotation.z=s2*Math.PI/2.5;arm.castShadow=true;player.add(arm);}}
var legGeo=new THREE.CylinderGeometry(0.3*s,0.3*s,1.0*s,8);
for(var s2 of [-1,1]){var leg=new THREE.Mesh(legGeo,bodyMat);leg.position.set(s2*0.2*s,0.2*s,0);leg.castShadow=true;player.add(leg);}
var omniGeo=new THREE.CircleGeometry(0.15*s,8);
var omniMat=new THREE.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.8});
var omni=new THREE.Mesh(omniGeo,omniMat);omni.position.set(0,0.7*s,0.42*s);player.add(omni);
if(alien.name==='HEATBLAST'){for(var i=0;i<8;i++){var fGeo=new THREE.SphereGeometry(0.1+Math.random()*0.1,4,4);var fMat=new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0.6});var f=new THREE.Mesh(fGeo,fMat);f.position.set((Math.random()-0.5)*0.6*s,0.6*s+Math.random()*0.8*s,(Math.random()-0.5)*0.6*s);player.add(f);}}
if(alien.name==='DIAMONDHEAD'){for(var s2 of [-1,1]){var spGeo=new THREE.ConeGeometry(0.12*s,0.3*s,4);var sp=new THREE.Mesh(spGeo,bodyMat);sp.position.set(s2*0.4*s,1.1*s,0);player.add(sp);}}
player.position.set(0,0,0);
player.userData.alien=alien;
scene.add(player);playerMesh=player;
}

function spawnEnemy(){
var drone=new THREE.Group();
var dMat=new THREE.MeshStandardMaterial({color:0x880000,emissive:0x440000,emissiveIntensity:0.3,metalness:0.6,roughness:0.4});
var body=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),dMat);body.castShadow=true;drone.add(body);
var eyeMat=new THREE.MeshBasicMaterial({color:0xff0000});
var eye=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),eyeMat);eye.position.z=0.4;drone.add(eye);
for(var s2 of [-1,1]){var wMat=new THREE.MeshBasicMaterial({color:0x440000,transparent:true,opacity:0.5});var wing=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.05,0.3),wMat);wing.position.set(s2*0.6,0,0);drone.add(wing);}
var angle=Math.random()*Math.PI*2;var dist=20+Math.random()*10;
drone.position.set(Math.cos(angle)*dist,2+Math.random()*3,Math.sin(angle)*dist);
drone.userData={hp:30+STATE.wave*5,speed:1.5+STATE.wave*0.1,dmat:dMat,attackTimer:2+Math.random()*2};
scene.add(drone);enemies.push(drone);
}

function spawnWave(){
var count=3+Math.floor(STATE.wave*1.5);
for(var i=0;i<count;i++){setTimeout(function(){if(STATE.playing)spawnEnemy()},i*500);}
showWaveBanner('WAVE '+STATE.wave,count+' ENEMIES');
}

function showWaveBanner(title,sub){
var b=document.getElementById('wave-banner');b.innerHTML=title+'<div class="sub">'+sub+'</div>';
b.classList.add('show');setTimeout(function(){b.classList.remove('show')},2000);
}

function playerAttack(){
if(STATE.attackCooldown>0)return;
var alien=player.userData.alien;STATE.attackCooldown=alien.attackCD;
if(alien.attackType==='melee'||alien.attackType==='dash'){
var range=alien.attackRange;var dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
for(var idx=0;idx<enemies.length;idx++){
var d=enemies[idx].position.clone().sub(player.position);d.y=0;
if(d.length()<range){damageEnemy(idx,alien.attackDmg);enemies[idx].position.add(dir.clone().multiplyScalar(2));}
}
createSlashEffect(range);
if(alien.attackType==='dash'){player.position.add(dir.multiplyScalar(4));}
}else{
var proj=new THREE.Group();
var pMat=new THREE.MeshBasicMaterial({color:alien.attackColor,transparent:true,opacity:0.9});
if(alien.attackType==='fireball'){var p=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),pMat);proj.add(p);
var trailGeo=new THREE.ConeGeometry(0.15,0.6,6);var trail=new THREE.Mesh(trailGeo,pMat);trail.rotation.x=Math.PI/2;trail.position.z=0.4;proj.add(trail);
}else if(alien.attackType==='crystal'){var p=new THREE.Mesh(new THREE.OctahedronGeometry(0.3),pMat);proj.add(p);
}else{var p=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.2,1,6),pMat);p.rotation.x=Math.PI/2;proj.add(p);}
var dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
proj.position.copy(player.position);proj.position.y=0.8;
proj.userData={dir:dir,speed:15,dmg:alien.attackDmg,life:3,type:alien.attackType,color:alien.attackColor};
scene.add(proj);projectiles.push(proj);
}
}

function createSlashEffect(range){
var alien=player.userData.alien;var dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
var ringGeo=new THREE.RingGeometry(range*0.5,range,16);
var ringMat=new THREE.MeshBasicMaterial({color:alien.attackColor,transparent:true,opacity:0.6,side:THREE.DoubleSide});
var ring=new THREE.Mesh(ringGeo,ringMat);ring.position.copy(player.position);ring.position.y=0.8;ring.rotation.x=-Math.PI/2;
scene.add(ring);particles.push({mesh:ring,life:0.3,maxLife:0.3,mat:ringMat});
}

function damageEnemy(idx,dmg){
var e=enemies[idx];if(!e)return;
e.userData.hp-=dmg;
e.userData.dmat.emissive.setHex(0xff0000);
setTimeout(function(){if(e.userData.dmat)e.userData.dmat.emissive.setHex(0x440000)},100);
if(e.userData.hp<=0){
createExplosion(e.position,0xff4400);scene.remove(e);enemies.splice(idx,1);
STATE.score+=100*STATE.wave;updateHUD();
if(enemies.length===0&&STATE.playing){
STATE.wave++;setTimeout(function(){if(STATE.playing)spawnWave()},2000);
if(STATE.wave%2===0&&STATE.aliensUnlocked<ALIENS.length){STATE.aliensUnlocked++;}
}
}
}

function createExplosion(pos,color){
for(var i=0;i<12;i++){
var pGeo=new THREE.SphereGeometry(0.1+Math.random()*0.2,4,4);
var pMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.8});
var p=new THREE.Mesh(pGeo,pMat);p.position.copy(pos);p.position.y+=Math.random()*0.5;
p.userData={vel:new THREE.Vector3((Math.random()-0.5)*8,Math.random()*6,(Math.random()-0.5)*8),life:0.8,maxLife:0.8,mat:pMat};
scene.add(p);particles.push(p.userData);particles[particles.length-1].mesh=p;
}
}

function updateEnemies(dt){
for(var idx=0;idx<enemies.length;idx++){
var e=enemies[idx];if(!e.userData)continue;
var d=player.position.clone().sub(e.position);d.y=0;var dist=d.length();d.normalize();
if(dist>3){e.position.add(d.multiplyScalar(e.userData.speed*dt));}
e.position.y=2+Math.sin(STATE.gameTime*3+idx)*0.5;
e.lookAt(player.position.x,e.position.y,player.position.z);
e.userData.attackTimer-=dt;
if(e.userData.attackTimer<=0&&dist<12){
e.userData.attackTimer=2+Math.random();
if(STATE.alive)takeDamage(8+STATE.wave*2);
}
}
}

function updateProjectiles(dt){
for(var idx=projectiles.length-1;idx>=0;idx--){
var p=projectiles[idx];p.position.add(p.userData.dir.clone().multiplyScalar(p.userData.speed*dt));p.userData.life-=dt;
var hit=false;
for(var eidx=0;eidx<enemies.length;eidx++){
if(p.position.distanceTo(enemies[eidx].position)<1.0){
damageEnemy(eidx,p.userData.dmg);
if(p.userData.type==='fireball')createExplosion(p.position,0xff4400);
hit=true;break;
}
}
if(hit||p.userData.life<=0){scene.remove(p);projectiles.splice(idx,1);}
}
}

function updateParticles(dt){
for(var idx=particles.length-1;idx>=0;idx--){
var p=particles[idx];if(!p.mesh){particles.splice(idx,1);continue;}
p.life-=dt;
if(p.vel){p.mesh.position.add(p.vel.clone().multiplyScalar(dt));p.vel.y-=9.8*dt;}
if(p.mat)p.mat.opacity=p.life/p.maxLife;
p.mesh.scale.setScalar(p.life/p.maxLife*1.2);
if(p.life<=0){scene.remove(p.mesh);particles.splice(idx,1);}
}
}

function takeDamage(dmg){
STATE.hp-=dmg;if(STATE.hp<0)STATE.hp=0;updateHUD();
if(STATE.hp<=0&&STATE.alive){gameOver();}
}

function transform(){
if(STATE.transformCooldown>0)return;
STATE.alienIndex++;
if(STATE.alienIndex>=STATE.aliensUnlocked)STATE.alienIndex=-1;
var alien=ALIENS[Math.max(0,STATE.alienIndex)];
var flash=document.getElementById('transform-flash');
flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');
setTimeout(function(){flash.classList.remove('show')},800);
createPlayer();
STATE.maxHp=alien.hp;
if(STATE.alienIndex>=0)STATE.hp=STATE.maxHp;else{STATE.maxHp=100;STATE.hp=Math.min(STATE.hp,100);}
updateHUD();
var popup=document.getElementById('alien-popup');
popup.innerHTML=alien.name+'<div class="sub">'+(STATE.alienIndex>=0?alien.ability:'BASE FORM')+'</div>';
popup.style.color='#'+alien.color.toString(16).padStart(6,'0');
popup.classList.remove('show');void popup.offsetWidth;popup.classList.add('show');
setTimeout(function(){popup.classList.remove('show')},1500);
STATE.transformCooldown=1.0;
}

function updateHUD(){
var hpPct=STATE.hp/STATE.maxHp*100;
var hpBar=document.getElementById('hp-bar');
hpBar.style.width=hpPct+'%';
hpBar.style.background=hpPct>50?'linear-gradient(90deg,#00ff00,#00cc44)':hpPct>25?'linear-gradient(90deg,#ffaa00,#ff8800)':'linear-gradient(90deg,#ff3333,#ff0000)';
document.getElementById('score-text').textContent=STATE.score.toLocaleString();
document.getElementById('wave-text').textContent='WAVE '+STATE.wave;
var alien=ALIENS[Math.max(0,STATE.alienIndex)];
var ca=document.getElementById('current-alien');ca.textContent=STATE.alienIndex>=0?alien.name:'BEN';
ca.style.color='#'+alien.color.toString(16).padStart(6,'0');
var ha=document.getElementById('hud-aliens');ha.innerHTML='';
for(var i=0;i<ALIENS.length;i++){
var a=ALIENS[i];var d=document.createElement('div');
d.className='hud-alien'+(i===STATE.alienIndex?' active':'')+(i>=STATE.aliensUnlocked?' locked':'');
d.textContent=a.emoji;
if(i===STATE.alienIndex)d.style.borderColor='#'+a.color.toString(16).padStart(6,'0');
ha.appendChild(d);
}
}

function gameLoop(){
requestAnimationFrame(gameLoop);
var dt=Math.min(clock.getDelta(),0.05);STATE.gameTime+=dt;
if(!STATE.playing){if(renderer)renderer.render(scene,camera);return;}
if(STATE.attackCooldown>0)STATE.attackCooldown-=dt;
if(STATE.transformCooldown>0)STATE.transformCooldown-=dt;
var alien=player.userData.alien;var speed=alien.speed;
if(STATE.moveDir.x||STATE.moveDir.z){
var mag=Math.sqrt(STATE.moveDir.x*STATE.moveDir.x+STATE.moveDir.z*STATE.moveDir.z);
if(mag>0){var nx=STATE.moveDir.x/mag,nz=STATE.moveDir.z/mag;
player.position.x+=nx*speed*dt;player.position.z+=nz*speed*dt;
player.position.x=Math.max(-48,Math.min(48,player.position.x));
player.position.z=Math.max(-48,Math.min(48,player.position.z));
player.rotation.y=Math.atan2(STATE.moveDir.x,STATE.moveDir.z);}
}
if(STATE.isJumping){STATE.velY-=15*dt;STATE.posY+=STATE.velY*dt;if(STATE.posY<=0){STATE.posY=0;STATE.isJumping=false;STATE.velY=0;}}
player.position.y=STATE.posY;
camera.position.x+=(player.position.x-camera.position.x)*0.1;
camera.position.z+=(player.position.z+15-camera.position.z)*0.1;camera.position.y=12;
camera.lookAt(player.position.x,2,player.position.z);
updateEnemies(dt);updateProjectiles(dt);updateParticles(dt);
renderer.render(scene,camera);
}

function gameOver(){
STATE.playing=false;STATE.alive=false;STATE.gameOver=true;
document.getElementById('go-stats').innerHTML='Waves: '+STATE.wave+' Score: '+STATE.score.toLocaleString()+' Best: '+ALIENS[Math.max(0,STATE.alienIndex)].name;
document.getElementById('game-over').classList.add('show');
}

function startGame(){
STATE.playing=true;STATE.alive=true;STATE.gameOver=false;
STATE.score=0;STATE.wave=1;STATE.hp=100;STATE.maxHp=100;
STATE.alienIndex=-1;STATE.aliensUnlocked=1;STATE.posY=0;
for(var i=0;i<enemies.length;i++)scene.remove(enemies[i]);enemies=[];
for(var i=0;i<projectiles.length;i++)scene.remove(projectiles[i]);projectiles=[];
for(var i=0;i<particles.length;i++){if(particles[i].mesh)scene.remove(particles[i].mesh);}particles=[];
if(player)player.position.set(0,0,0);
createPlayer();updateHUD();
document.getElementById('start-screen').classList.add('hidden');
document.getElementById('game-over').classList.remove('show');
document.getElementById('hud').classList.add('show');
document.getElementById('controls').classList.add('show');
spawnWave();
}

// ============ JOYSTICK ============
var joyActive=false,joyId=null;
var joyBase=document.getElementById('joy-base');
var joyKnob=document.getElementById('joy-knob');

function joyStart(e){
e.preventDefault();var t=e.changedTouches?e.changedTouches[0]:e;
joyActive=true;joyId=t.identifier||0;
}
function joyMove(e){
e.preventDefault();if(!joyActive)return;
var rect=joyBase.getBoundingClientRect();
var cx,cy;
if(e.touches){for(var i=0;i<e.touches.length;i++){if(e.touches[i].identifier===joyId){cx=e.touches[i].clientX;cy=e.touches[i].clientY;}}}
else{cx=e.clientX;cy=e.clientY;}
if(cx===undefined)return;
var dx=cx-rect.left-rect.width/2;var dy=cy-rect.top-rect.height/2;
var mag=Math.sqrt(dx*dx+dy*dy);var max=rect.width/2-20;
if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}
joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
STATE.moveDir.x=dx/max;STATE.moveDir.z=dy/max;
}
function joyEnd(e){e.preventDefault();joyActive=false;joyId=null;
joyKnob.style.transform='translate(0,0)';STATE.moveDir={x:0,z:0};}

joyBase.addEventListener('touchstart',joyStart,{passive:false});
joyBase.addEventListener('touchmove',joyMove,{passive:false});
joyBase.addEventListener('touchend',joyEnd,{passive:false});
joyBase.addEventListener('mousedown',joyStart);
document.addEventListener('mousemove',joyMove);
document.addEventListener('mouseup',joyEnd);

// ============ BUTTONS (pointer events work on touch+mouse) ============
function bindBtn(id,fn){
var el=document.getElementById(id);
el.addEventListener('pointerdown',function(e){e.preventDefault();fn();},{passive:false});
el.addEventListener('click',function(e){e.preventDefault();fn();});
}
bindBtn('omni-btn',function(){if(STATE.playing)transform();});
bindBtn('attack-btn',function(){if(STATE.playing)playerAttack();});
bindBtn('jump-btn',function(){if(STATE.playing&&!STATE.isJumping){STATE.isJumping=true;STATE.velY=6;}});

// ============ KEYBOARD ============
document.addEventListener('keydown',function(e){
if(!STATE.playing)return;
if(e.key===' ')transform();
if(e.key==='f'||e.key==='F')playerAttack();
if(e.key==='w'||e.key==='ArrowUp')STATE.moveDir.z=-1;
if(e.key==='s'||e.key==='ArrowDown')STATE.moveDir.z=1;
if(e.key==='a'||e.key==='ArrowLeft')STATE.moveDir.x=-1;
if(e.key==='d'||e.key==='ArrowRight')STATE.moveDir.x=1;
});
document.addEventListener('keyup',function(e){
if(e.key==='w'||e.key==='s'||e.key==='ArrowUp'||e.key==='ArrowDown')STATE.moveDir.z=0;
if(e.key==='a'||e.key==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')STATE.moveDir.x=0;
});

// ============ START ============
document.getElementById('start-btn').addEventListener('pointerdown',function(e){e.preventDefault();startGame();return false;},{passive:false});
document.getElementById('start-btn').addEventListener('click',function(e){e.preventDefault();startGame();return false;});
document.getElementById('retry-btn').addEventListener('pointerdown',function(e){e.preventDefault();startGame();return false;},{passive:false});
document.getElementById('retry-btn').addEventListener('click',function(e){e.preventDefault();startGame();return false;});

window.addEventListener('resize',function(){if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}});

// ============ INIT ============
try{
initThree();
gameLoop();
setTimeout(function(){document.getElementById('loading').classList.add('hidden');},500);
}catch(err){
document.getElementById('loading').innerHTML='<div style="color:#f00;text-align:center;padding:20px;font-size:14px">خطأ: '+err.message+'<br>أعد تحميل الصفحة</div>';
}
</script>
</body>
</html>
