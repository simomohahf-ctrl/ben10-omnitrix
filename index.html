<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BEN 10: OMNITRIX POWER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Arial Black',sans-serif;touch-action:none}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
/* LOADING */
#loading{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0a2a,#1a0a2a,#2a0a1a);display:flex;flex-direction:column;align-items:center;justify-content:center}
#loading.hidden{display:none}
.omnitrix-load{width:120px;height:120px;border-radius:50%;border:8px solid #0f0;border:8px solid transparent;border-top-color:#00ff00;border-right-color:#00ccff;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:18px;font-weight:900;background:linear-gradient(90deg,#00ff00,#00ccff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.load-bar{width:200px;height:6px;background:#222;border-radius:3px;margin-top:12px;overflow:hidden}
.load-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00ff00,#00ccff);transition:width .3s;border-radius:3px}
/* START SCREEN */
#start-screen{position:fixed;inset:0;z-index:900;background:radial-gradient(ellipse at center,#1a1a4a 0%,#0a0a1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#start-screen.hidden{display:none}
.game-title{font-size:48px;font-weight:900;text-align:center;line-height:1.1;margin-bottom:6px;
background:linear-gradient(135deg,#00ff00 0%,#00ccff 50%,#00ffff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(0,255,0,.3)}
.game-sub{font-size:16px;color:#00ccff;letter-spacing:3px;margin-bottom:30px;font-weight:700}
.start-btn{padding:16px 48px;border-radius:50px;border:3px solid #00ff00;background:rgba(0,255,0,.1);color:#fff;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 0 30px rgba(0,255,0,.3);transition:all .2s}
.start-btn:active{transform:scale(.95);box-shadow:0 0 50px rgba(0,255,0,.5)}
.alien-preview{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;max-width:350px}
.alien-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #333;background:rgba(255,255,255,.05)}
.how-to{font-size:12px;color:#888;text-align:center;line-height:1.6;max-width:280px;margin-top:16px}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:100;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 14px 0}
.hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hp-container{width:140px;height:14px;background:rgba(0,0,0,.6);border-radius:7px;border:1px solid #333;overflow:hidden}
.hp-fill{height:100%;width:100%;border-radius:6px;transition:width .3s,background .3s}
.score-display{font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(0,255,255,.5)}
.wave-display{font-size:14px;font-weight:700;color:#ffcc00;text-shadow:0 0 6px rgba(255,204,0,.4)}
.hud-aliens{display:flex;gap:6px;justify-content:center;margin-top:4px}
.hud-alien{width:36px;height:36px;border-radius:10px;border:2px solid #333;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.hud-alien.active{border-color:#00ff00;box-shadow:0 0 12px rgba(0,255,0,.4);transform:scale(1.15)}
.hud-alien.locked{opacity:.3}
/* CONTROLS */
#controls{position:fixed;bottom:0;left:0;right:0;z-index:100;height:200px;pointer-events:none}
.joystick-base{position:absolute;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
.joystick-knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(0,255,0,.3);border:2px solid #00ff00;left:35px;top:35px;transition:transform .05s;box-shadow:0 0 12px rgba(0,255,0,.3)}
.action-buttons{position:absolute;bottom:30px;right:30px;display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto}
.omnitrix-btn{width:80px;height:80px;border-radius:50%;border:3px solid #00ff00;background:radial-gradient(circle,#001a00,#000);color:#00ff00;font-size:32px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 0 20px rgba(0,255,0,.3);transition:all .15s}
.omnitrix-btn:active{transform:scale(.9);box-shadow:0 0 40px rgba(0,255,0,.6)}
.omnitrix-btn.transforming{animation:omniPulse .3s ease infinite alternate}
@keyframes omniPulse{from{box-shadow:0 0 20px rgba(0,255,0,.3)}to{box-shadow:0 0 60px rgba(0,255,0,.8)}}
.attack-btn{width:64px;height:64px;border-radius:50%;border:2px solid #ff4444;background:rgba(255,68,68,.2);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 0 12px rgba(255,68,68,.3)}
.attack-btn:active{transform:scale(.88);background:rgba(255,68,68,.4)}
.jump-btn{width:56px;height:56px;border-radius:50%;border:2px solid #4488ff;background:rgba(68,136,255,.2);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.jump-btn:active{transform:scale(.88)}
/* TRANSFORM FLASH */
#transform-flash{position:fixed;inset:0;z-index:800;background:radial-gradient(circle,rgba(0,255,0,.8),rgba(0,200,255,.4),transparent);display:none;pointer-events:none;animation:flashOut .8s ease forwards}
#transform-flash.show{display:block}
@keyframes flashOut{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.alien-name-popup{position:fixed;top:35%;left:50%;transform:translateX(-50%);z-index:850;font-size:28px;font-weight:900;text-shadow:0 0 20px currentColor;opacity:0;transition:all .3s;pointer-events:none;text-align:center}
.alien-name-popup.show{opacity:1;top:30%}
.alien-name-popup .sub{font-size:14px;opacity:.7;letter-spacing:2px}
/* GAME OVER */
#game-over{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center}
#game-over.show{display:flex}
.go-title{font-size:42px;font-weight:900;color:#ff3333;margin-bottom:16px;text-shadow:0 0 20px rgba(255,51,51,.5)}
.go-stats{font-size:16px;color:#aaa;margin-bottom:24px;text-align:center;line-height:2}
.go-retry{padding:14px 40px;border-radius:50px;border:3px solid #00ff00;background:rgba(0,255,0,.1);color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit}
.go-retry:active{transform:scale(.95)}
/* WAVE BANNER */
#wave-banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:700;font-size:36px;font-weight:900;color:#ffcc00;text-shadow:0 0 20px rgba(255,204,0,.6);opacity:0;pointer-events:none;text-align:center;transition:opacity .5s}
#wave-banner.show{opacity:1}
#wave-banner .sub{font-size:16px;color:#aaa}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="loading">
<div class="omnitrix-load"></div>
<div class="load-text">BEN 10 OMNITRIX</div>
<div class="load-bar"><div class="load-bar-fill" id="load-bar"></div></div>
</div>

<div id="start-screen">
<div class="game-title">BEN 10<br>OMNITRIX POWER</div>
<div class="game-sub">★ ALIEN FORCE ★</div>
<div class="alien-preview">
<div class="alien-icon" style="border-color:#00ccff">🧠</div>
<div class="alien-icon" style="border-color:#ff6600">🔥</div>
<div class="alien-icon" style="border-color:#ff0000">💪</div>
<div class="alien-icon" style="border-color:#0066ff">⚡</div>
<div class="alien-icon" style="border-color:#00ffaa">💎</div>
</div>
<button class="start-btn" id="start-btn">▶ PLAY</button>
<div class="how-to">التحكم: الجويستيك لتحرك، ⚔ للهجوم، 🛗 للقفز، 🟢 Omnitrix للتحويل<br>قاتل موجات الأعداء وابقى حي!</div>
</div>

<div id="hud" class="hidden" style="display:none">
<div class="hud-top">
<div>
<div class="hp-container"><div class="hp-fill" id="hp-bar"></div></div>
<div style="font-size:11px;color:#aaa;margin-top:2px">HP</div>
</div>
<div style="text-align:center">
<div class="wave-display" id="wave-text">WAVE 1</div>
<div class="score-display" id="score-text">0</div>
</div>
<div style="text-align:right">
<div style="font-size:11px;color:#aaa">ALIEN</div>
<div id="current-alien" style="font-size:16px;font-weight:900;color:#00ff00">BEN</div>
</div>
</div>
<div class="hud-aliens" id="hud-aliens"></div>
</div>

<div id="controls" style="display:none">
<div class="joystick-base" id="joy-base"><div class="joystick-knob" id="joy-knob"></div></div>
<div class="action-buttons">
<button class="omnitrix-btn" id="omni-btn">🟢</button>
<button class="attack-btn" id="attack-btn">⚔</button>
<button class="jump-btn" id="jump-btn">🛗</button>
</div>
</div>

<div id="transform-flash"></div>
<div class="alien-name-popup" id="alien-popup"></div>
<div id="wave-banner"></div>

<div id="game-over">
<div class="go-title">GAME OVER</div>
<div class="go-stats" id="go-stats">Waves: 0<br>Score: 0<br>Best Alien: —</div>
<button class="go-retry" id="retry-btn">↻ RETRY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ GAME STATE ============
const STATE={loading:true,playing:false,gameOver:false,score:0,wave:1,
hp:100,maxHp:100,alienIndex:-1,aliensUnlocked:1,transformCooldown:0,
attackCooldown:0,waveEnemies:0,alive:true,
moveDir:{x:0,z:0},isJumping:false,
velY:0,posY:0,gameTime:0};

// ============ ALIENS ============
const ALIENS=[
{name:'BEN',emoji:'🧑',color:0x44aa44,size:1.0,speed:5,hp:100,
attackDmg:10,attackRange:3,attackCD:0.5,attackColor:0x44ff44,attackType:'melee',
ability:'Punch',special:'No special'},
{name:'GREY MATTER',emoji:'🧠',color:0x00ccff,size:0.5,speed:7,hp:60,
attackDmg:8,attackRange:4,attackCD:0.3,attackColor:0x00ffff,attackType:'beam',
ability:'Smart Beam',special:'Tiny & fast — dodge easily!'},
{name:'HEATBLAST',emoji:'🔥',color:0xff6600,size:1.1,speed:4,hp:80,
attackDmg:25,attackRange:8,attackCD:0.8,attackColor:0xff4400,attackType:'fireball',
ability:'Fireball',special:'Long range explosive fire!'},
{name:'FOUR ARMS',emoji:'💪',color:0xff0000,size:1.4,speed:3,hp:140,
attackDmg:40,attackRange:3.5,attackCD:1.0,attackColor:0xff3333,attackType:'melee',
ability:'Quadruple Smash',special:'Massive damage, tanky!'},
{name:'XLR8',emoji:'⚡',color:0x0066ff,size:0.9,speed:10,hp:70,
attackDmg:15,attackRange:5,attackCD:0.25,attackColor:0x00aaff,attackType:'dash',
ability:'Dash Strike',special:'Super fast hit and run!'},
{name:'DIAMONDHEAD',emoji:'💎',color:0x00ffaa,size:1.0,speed:5,hp:90,
attackDmg:20,attackRange:7,attackCD:0.6,attackColor:0x00ffcc,attackType:'crystal',
ability:'Crystal Shards',special:'Sharp crystal projectiles!'}
];

// ============ THREE.JS SETUP ============
let scene,camera,renderer,player,playerMesh,ground;
let enemies=[],projectiles=[],particles=[],buildings=[];
const clock=new THREE.Clock();

function initThree(){
scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a0a2a,0.012);
scene.background=new THREE.Color(0x0a0a2a);
camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
camera.position.set(0,15,20);
camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game-canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

// Lights
const amb=new THREE.AmbientLight(0x404060,0.6);
scene.add(amb);
const sun=new THREE.DirectionalLight(0x8888ff,0.8);
sun.position.set(20,40,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=100;
sun.shadow.camera.left=-50;sun.shadow.camera.right=50;
sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
scene.add(sun);

// Ground
const gGeo=new THREE.PlaneGeometry(100,100);
const gMat=new THREE.MeshStandardMaterial({color:0x1a1a2a,roughness:0.9});
ground=new THREE.Mesh(gGeo,gMat);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Grid pattern
const grid=new THREE.GridHelper(100,50,0x333355,0x222244);
grid.position.y=0.01;
scene.add(grid);

// Buildings (city environment)
for(let i=0;i<40;i++){
const h=4+Math.random()*16;
const w=3+Math.random()*4;
const d=3+Math.random()*4;
const x=(Math.random()-0.5)*90;
const z=(Math.random()-0.5)*90;
if(Math.abs(x)<12&&Math.abs(z)<12)continue;
const bGeo=new THREE.BoxGeometry(w,h,d);
const bMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.6+Math.random()*0.1,0.3,0.15+Math.random()*0.1),roughness:0.8,metalness:0.2});
const b=new THREE.Mesh(bGeo,bMat);
b.position.set(x,h/2,z);
b.castShadow=true;b.receiveShadow=true;
scene.add(b);
buildings.push(b);
// Windows (emissive dots)
for(let wy=1;wy<h-0.5;wy+=1.5){
for(let wx=-w/2+0.5;wx<w/2;wx+=1.5){
if(Math.random()>0.4){
const wGeo=new THREE.PlaneGeometry(0.6,0.6);
const wMat=new THREE.MeshBasicMaterial({color:0x00ffff,transparent:true,opacity:0.6});
const win=new THREE.Mesh(wGeo,wMat);
win.position.set(wx+0.01,wy,0);
win.position.x=b.position.x;win.position.y=wy;win.position.z=b.position.z+d/2+0.01;
// Random wall
if(Math.random()>0.5){win.position.x=b.position.x+w/2+0.01;win.position.z=b.position.z+Math.random()*d-d/2;win.rotation.y=Math.PI/2;}
scene.add(win);
}
}
}
}

// Stars
for(let i=0;i<200;i++){
const starGeo=new THREE.SphereGeometry(0.15,4,4);
const starMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:Math.random()*0.8+0.2});
const star=new THREE.Mesh(starGeo,starMat);
star.position.set((Math.random()-0.5)*200,30+Math.random()*60,(Math.random()-0.5)*200);
scene.add(star);
}

createPlayer();
}

// ============ PLAYER ============
function createPlayer(){
if(player)scene.remove(player);
const alien=ALIENS[Math.max(0,STATE.alienIndex)];
const s=alien.size;
player=new THREE.Group();

// Body
const bodyMat=new THREE.MeshStandardMaterial({color:alien.color,roughness:0.5,metalness:0.3,emissive:alien.color,emissiveIntensity:0.15});
const bodyGeo=new THREE.CapsuleGeometry(0.4*s,0.8*s,4,8);
const body=new THREE.Mesh(bodyGeo,bodyMat);
body.position.y=0.6*s;
body.castShadow=true;
player.add(body);

// Head
const headGeo=new THREE.SphereGeometry(0.35*s,8,8);
const head=new THREE.Mesh(headGeo,bodyMat);
head.position.y=1.35*s;
head.castShadow=true;
player.add(head);

// Eyes
const eyeGeo=new THREE.SphereGeometry(0.08*s,4,4);
const eyeMat=new THREE.MeshBasicMaterial({color:0xffff00});
const eyeL=new THREE.Mesh(eyeGeo,eyeMat);
eyeL.position.set(-0.12*s,1.4*s,0.25*s);
const eyeR=eyeL.clone();eyeR.position.x=0.12*s;
player.add(eyeL,eyeR);

// Arms
const armGeo=new THREE.CapsuleGeometry(0.12*s,0.5*s,4,6);
if(alien.name==='FOUR ARMS'){
// 4 arms
for(let s2 of [-1,1]){
for(let a of [0.3,-0.3]){
const arm=new THREE.Mesh(armGeo,bodyMat);
arm.position.set(s2*(0.45*s),0.7*s,0);
arm.rotation.z=s2*(Math.PI/2+a);
arm.castShadow=true;
player.add(arm);
}
}
} else {
for(let s2 of [-1,1]){
const arm=new THREE.Mesh(armGeo,bodyMat);
arm.position.set(s2*(0.4*s),0.7*s,0);
arm.rotation.z=s2*Math.PI/2.5;
arm.castShadow=true;
player.add(arm);
}
}

// Legs
const legGeo=new THREE.CapsuleGeometry(0.15*s,0.4*s,4,6);
for(let s2 of [-1,1]){
const leg=new THREE.Mesh(legGeo,bodyMat);
leg.position.set(s2*0.2*s,0.2*s,0);
leg.castShadow=true;
player.add(leg);
}

// Omnitrix symbol on chest
const omniGeo=new THREE.CircleGeometry(0.15*s,8);
const omniMat=new THREE.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.8});
const omni=new THREE.Mesh(omniGeo,omniMat);
omni.position.set(0,0.7*s,0.42*s);
player.add(omni);

// Special features per alien
if(alien.name==='HEATBLAST'){
// Fire particles around body
for(let i=0;i<8;i++){
const fGeo=new THREE.SphereGeometry(0.1+Math.random()*0.1,4,4);
const fMat=new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0.6});
const f=new THREE.Mesh(fGeo,fMat);
f.position.set((Math.random()-0.5)*0.6*s,0.6*s+Math.random()*0.8*s,(Math.random()-0.5)*0.6*s);
player.add(f);
}
}
if(alien.name==='DIAMONDHEAD'){
// Crystal spikes on shoulders
for(let s2 of [-1,1]){
const spGeo=new THREE.ConeGeometry(0.12*s,0.3*s,4);
const sp=new THREE.Mesh(spGeo,bodyMat);
sp.position.set(s2*0.4*s,1.1*s,0);
player.add(sp);
}
}

player.position.set(0,0,0);
player.userData.alien=alien;
player.userData.bodyMat=bodyMat;
scene.add(player);
playerMesh=player;
}

// ============ ENEMIES ============
function spawnEnemy(){
const drone=new THREE.Group();
const dMat=new THREE.MeshStandardMaterial({color:0x880000,emissive:0x440000,emissiveIntensity:0.3,metalness:0.6,roughness:0.4});
// Body
const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),dMat);
body.castShadow=true;
drone.add(body);
// Eye/laser
const eyeMat=new THREE.MeshBasicMaterial({color:0xff0000});
const eye=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),eyeMat);
eye.position.z=0.4;
drone.add(eye);
// Wings/propellers
for(let s2 of [-1,1]){
const wMat=new THREE.MeshBasicMaterial({color:0x440000,transparent:true,opacity:0.5});
const wing=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.05,0.3),wMat);
wing.position.set(s2*0.6,0,0);
drone.add(wing);
}
// Spawn position
const angle=Math.random()*Math.PI*2;
const dist=20+Math.random()*10;
drone.position.set(Math.cos(angle)*dist,2+Math.random()*3,Math.sin(angle)*dist);
drone.userData={hp:30+STATE.wave*5,speed:1.5+STATE.wave*0.1,attackCD:0,
dmat:dMat,eyeMat:eyeMat,attackTimer:2+Math.random()*2};
scene.add(drone);
enemies.push(drone);
}

function spawnWave(){
const count=3+Math.floor(STATE.wave*1.5);
STATE.waveEnemies=count;
for(let i=0;i<count;i++){
setTimeout(()=>{if(STATE.playing)spawnEnemy()},i*500);
}
showWaveBanner('WAVE '+STATE.wave,count+' ENEMIES');
}

function showWaveBanner(title,sub){
const b=document.getElementById('wave-banner');
b.innerHTML=title+'<div class="sub">'+sub+'</div>';
b.classList.add('show');
setTimeout(()=>b.classList.remove('show'),2000);
}

// ============ COMBAT ============
function playerAttack(){
if(STATE.attackCooldown>0)return;
const alien=player.userData.alien;
STATE.attackCooldown=alien.attackCD;
const atype=alien.attackType;

if(atype==='melee'||atype==='dash'){
// Melee — damage enemies in range
const range=alien.attackRange;
let dir=new THREE.Vector3();
camera.getWorldDirection(dir);
dir.y=0;dir.normalize();
enemies.forEach((e,idx)=>{
const d=e.position.clone().sub(player.position);
d.y=0;
if(d.length()<range){
damageEnemy(idx,alien.attackDmg);
// Knockback
e.position.add(dir.clone().multiplyScalar(2));
}
});
// Attack effect
createSlashEffect(range);
if(atype==='dash'){
// Dash forward
player.position.add(dir.multiplyScalar(4));
}
} else if(atype==='fireball'||atype==='crystal'||atype==='beam'){
// Ranged projectile
const proj=new THREE.Group();
const pMat=new THREE.MeshBasicMaterial({color:alien.attackColor,transparent:true,opacity:0.9});
if(atype==='fireball'){
const pGeo=new THREE.SphereGeometry(0.3,8,8);
const p=new THREE.Mesh(pGeo,pMat);
proj.add(p);
// Trail
const trailGeo=new THREE.ConeGeometry(0.15,0.6,6);
const trail=new THREE.Mesh(trailGeo,pMat);
trail.rotation.x=Math.PI/2;
trail.position.z=0.4;
proj.add(trail);
} else if(atype==='crystal'){
const pGeo=new THREE.OctahedronGeometry(0.3);
const p=new THREE.Mesh(pGeo,pMat);
proj.add(p);
} else {
// Beam
const pGeo=new THREE.CylinderGeometry(0.1,0.2,1,6);
const p=new THREE.Mesh(pGeo,pMat);
p.rotation.x=Math.PI/2;
proj.add(p);
}
let dir=new THREE.Vector3();
camera.getWorldDirection(dir);
dir.y=0;dir.normalize();
proj.position.copy(player.position);
proj.position.y=0.8;
proj.userData={dir:dir,speed:atype==='beam'?20:15,dmg:alien.attackDmg,life:3,type:atype,color:alien.attackColor};
scene.add(proj);
projectiles.push(proj);
}
}

function createSlashEffect(range){
const alien=player.userData.alien;
let dir=new THREE.Vector3();
camera.getWorldDirection(dir);
dir.y=0;dir.normalize();
const ringGeo=new THREE.RingGeometry(range*0.5,range,16);
const ringMat=new THREE.MeshBasicMaterial({color:alien.attackColor,transparent:true,opacity:0.6,side:THREE.DoubleSide});
const ring=new THREE.Mesh(ringGeo,ringMat);
ring.position.copy(player.position);
ring.position.y=0.8;
ring.rotation.x=-Math.PI/2;
ring.userData={life:0.3,mat:ringMat};
scene.add(ring);
particles.push({mesh:ring,life:0.3,maxLife:0.3,mat:ringMat});
}

function damageEnemy(idx,dmg){
const e=enemies[idx];
if(!e)return;
e.userData.hp-=dmg;
// Flash red
e.userData.dmat.emissive.setHex(0xff0000);
setTimeout(()=>{if(e.userData.dmat)e.userData.dmat.emissive.setHex(0x440000)},100);
if(e.userData.hp<=0){
// Explosion
createExplosion(e.position,0xff4400);
scene.remove(e);
enemies.splice(idx,1);
STATE.score+=100*STATE.wave;
updateHUD();
if(enemies.length===0&&STATE.playing){
STATE.wave++;
setTimeout(()=>{if(STATE.playing)spawnWave()},2000);
// Unlock new alien every 2 waves
if(STATE.wave%2===0&&STATE.aliensUnlocked<ALIENS.length){
STATE.aliensUnlocked++;
showAlienUnlocked(ALIENS[STATE.aliensUnlocked-1]);
}
}
}
}

function createExplosion(pos,color){
for(let i=0;i<12;i++){
const pGeo=new THREE.SphereGeometry(0.1+Math.random()*0.2,4,4);
const pMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.8});
const p=new THREE.Mesh(pGeo,pMat);
p.position.copy(pos);
p.position.y+=Math.random()*0.5;
p.userData={vel:new THREE.Vector3((Math.random()-0.5)*8,Math.random()*6,(Math.random()-0.5)*8),life:0.8,maxLife:0.8,mat:pMat};
scene.add(p);
particles.push(p.userData);
particles[particles.length-1].mesh=p;
}
}

// ============ ENEMY AI ============
function updateEnemies(dt){
enemies.forEach((e,idx)=>{
if(!e.userData)return;
const d=player.position.clone().sub(e.position);
d.y=0;
const dist=d.length();
d.normalize();
// Move towards player
if(dist>3){
e.position.add(d.multiplyScalar(e.userData.speed*dt));
}
// Hover
e.position.y=2+Math.sin(STATE.gameTime*3+idx)*0.5;
e.lookAt(player.position.x,e.position.y,player.position.z);
// Rotate wings
e.children.forEach((c,i)=>{
if(i>1)c.rotation.z+=dt*5;
});
// Attack
e.userData.attackTimer-=dt;
if(e.userData.attackTimer<=0&&dist<12){
e.userData.attackTimer=2+Math.random();
// Fire laser at player
const laserGeo=new THREE.CylinderGeometry(0.05,0.05,dist,4);
const laserMat=new THREE.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:0.7});
const laser=new THREE.Mesh(laserGeo,laserMat);
laser.position.copy(e.position).lerp(player.position,0.5);
laser.position.y=player.position.y+0.8;
laser.lookAt(player.position);
laser.rotation.x+=Math.PI/2;
laser.userData={life:0.2,mat:laserMat};
scene.add(laser);
particles.push({mesh:laser,life:0.2,maxLife:0.2,mat:laserMat});
// Damage player
if(STATE.alive)takeDamage(8+STATE.wave*2);
}
});
}

// ============ PROJECTILES ============
function updateProjectiles(dt){
projectiles.forEach((p,idx)=>{
p.position.add(p.userData.dir.clone().multiplyScalar(p.userData.speed*dt));
p.userData.life-=dt;
// Check enemy hits
let hit=false;
enemies.forEach((e,eidx)=>{
const d=p.position.distanceTo(e.position);
if(d<1.0){
damageEnemy(eidx,p.userData.dmg);
if(p.userData.type==='fireball')createExplosion(p.position,0xff4400);
hit=true;
}
});
if(hit||p.userData.life<=0){
scene.remove(p);
projectiles.splice(idx,1);
}
});
}

// ============ PARTICLES ============
function updateParticles(dt){
particles.forEach((p,idx)=>{
if(!p.mesh){particles.splice(idx,1);return;}
p.life-=dt;
if(p.vel){
p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
p.vel.y-=9.8*dt;
}
if(p.mat)p.mat.opacity=p.life/p.maxLife;
p.mesh.scale.setScalar(p.life/p.maxLife*1.2);
if(p.life<=0){
scene.remove(p.mesh);
particles.splice(idx,1);
}
});
}

// ============ DAMAGE ============
function takeDamage(dmg){
STATE.hp-=dmg;
if(STATE.hp<0)STATE.hp=0;
updateHUD();
// Screen flash
renderer.clear();
if(STATE.hp<=0&&STATE.alive){
gameOver();
}
}

// ============ TRANSFORM ============
function transform(){
if(STATE.transformCooldown>0)return;
STATE.alienIndex++;
if(STATE.alienIndex>=STATE.aliensUnlocked)STATE.alienIndex=-1;
const alien=ALIENS[Math.max(0,STATE.alienIndex)];
// Flash effect
const flash=document.getElementById('transform-flash');
flash.classList.remove('show');
void flash.offsetWidth;
flash.classList.add('show');
setTimeout(()=>flash.classList.remove('show'),800);
// Update player model
createPlayer();
// Update HP
const oldMaxHp=STATE.maxHp;
STATE.maxHp=alien.hp;
STATE.hp=Math.min(STATE.hp,STATE.maxHp);
if(STATE.alienIndex>=0)STATE.hp=STATE.maxHp;
updateHUD();
// Show name popup
const popup=document.getElementById('alien-popup');
popup.innerHTML=alien.name+'<div class="sub">'+(STATE.alienIndex>=0?alien.ability:'BASE FORM')+'</div>';
popup.style.color='#'+alien.color.toString(16).padStart(6,'0');
popup.classList.remove('show');
void popup.offsetWidth;
popup.classList.add('show');
setTimeout(()=>popup.classList.remove('show'),1500);
STATE.transformCooldown=1.0;
}

function showAlienUnlocked(alien){
const popup=document.getElementById('alien-popup');
popup.innerHTML='UNLOCKED!<br>'+alien.name+'<div class="sub">'+alien.special+'</div>';
popup.style.color='#'+alien.color.toString(16).padStart(6,'0');
popup.classList.remove('show');
void popup.offsetWidth;
popup.classList.add('show');
setTimeout(()=>popup.classList.remove('show'),2500);
}

// ============ CONTROLS ============
let joyActive=false,joyId=null;
const joyBase=document.getElementById('joy-base');
const joyKnob=document.getElementById('joy-knob');

joyBase.addEventListener('touchstart',e=>{
e.preventDefault();
const t=e.changedTouches[0];
joyActive=true;joyId=t.identifier;
});
joyBase.addEventListener('touchmove',e=>{
e.preventDefault();
if(!joyActive)return;
const rect=joyBase.getBoundingClientRect();
for(let t of e.touches){
if(t.identifier===joyId){
let dx=t.clientX-rect.left-rect.width/2;
let dy=t.clientY-rect.top-rect.height/2;
const mag=Math.sqrt(dx*dx+dy*dy);
const max=rect.width/2-20;
if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}
joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
STATE.moveDir.x=dx/max;
STATE.moveDir.z=dy/max;
}
}
});
joyBase.addEventListener('touchend',e=>{
e.preventDefault();
joyActive=false;joyId=null;
joyKnob.style.transform='translate(0,0)';
STATE.moveDir={x:0,z:0};
});

// Mouse joystick (desktop)
joyBase.addEventListener('mousedown',e=>{
joyActive=true;
const onMove=ev=>{
if(!joyActive)return;
const rect=joyBase.getBoundingClientRect();
let dx=ev.clientX-rect.left-rect.width/2;
let dy=ev.clientY-rect.top-rect.height/2;
const mag=Math.sqrt(dx*dx+dy*dy);
const max=rect.width/2-20;
if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}
joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
STATE.moveDir.x=dx/max;STATE.moveDir.z=dy/max;
};
const onUp=()=>{
joyActive=false;
joyKnob.style.transform='translate(0,0)';
STATE.moveDir={x:0,z:0};
document.removeEventListener('mousemove',onMove);
document.removeEventListener('mouseup',onUp);
};
document.addEventListener('mousemove',onMove);
document.addEventListener('mouseup',onUp);
});

// Buttons
document.getElementById('omni-btn').addEventListener('click',transform);
document.getElementById('attack-btn').addEventListener('click',()=>{
if(STATE.playing)playerAttack();
});
document.getElementById('jump-btn').addEventListener('click',()=>{
if(STATE.playing&&!STATE.isJumping){
STATE.isJumping=true;STATE.velY=6;
}
});

// Keyboard
document.addEventListener('keydown',e=>{
if(!STATE.playing)return;
if(e.key===' ')transform();
if(e.key==='f'||e.key==='F')playerAttack();
if(e.key==='w'||e.key==='ArrowUp'){STATE.moveDir.z=-1}
if(e.key==='s'||e.key==='ArrowDown'){STATE.moveDir.z=1}
if(e.key==='a'||e.key==='ArrowLeft'){STATE.moveDir.x=-1}
if(e.key==='d'||e.key==='ArrowRight'){STATE.moveDir.x=1}
if(e.key===' '&&!STATE.isJumping){STATE.isJumping=true;STATE.velY=6}
});
document.addEventListener('keyup',e=>{
if(e.key==='w'||e.key==='s'||e.key==='ArrowUp'||e.key==='ArrowDown')STATE.moveDir.z=0;
if(e.key==='a'||e.key==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')STATE.moveDir.x=0;
});

// ============ HUD ============
function updateHUD(){
const hpPct=STATE.hp/STATE.maxHp*100;
const hpBar=document.getElementById('hp-bar');
hpBar.style.width=hpPct+'%';
hpBar.style.background=hpPct>50?'linear-gradient(90deg,#00ff00,#00cc44)':hpPct>25?'linear-gradient(90deg,#ffaa00,#ff8800)':'linear-gradient(90deg,#ff3333,#ff0000)';
document.getElementById('score-text').textContent=STATE.score.toLocaleString();
document.getElementById('wave-text').textContent='WAVE '+STATE.wave;
const alien=ALIENS[Math.max(0,STATE.alienIndex)];
const ca=document.getElementById('current-alien');
ca.textContent=STATE.alienIndex>=0?alien.name:'BEN';
ca.style.color='#'+alien.color.toString(16).padStart(6,'0');
// Alien bar
const ha=document.getElementById('hud-aliens');
ha.innerHTML='';
ALIENS.forEach((a,i)=>{
const d=document.createElement('div');
d.className='hud-alien'+(i===STATE.alienIndex?' active':'')+(i>=STATE.aliensUnlocked?' locked':'');
d.textContent=a.emoji;
d.style.borderColor=i===STATE.alienIndex?'#'+a.color.toString(16).padStart(6,'0'):'';
ha.appendChild(d);
});
}

// ============ GAME LOOP ============
function gameLoop(){
requestAnimationFrame(gameLoop);
const dt=Math.min(clock.getDelta(),0.05);
STATE.gameTime+=dt;
if(!STATE.playing){
renderer.render(scene,camera);
return;
}
// Cooldowns
if(STATE.attackCooldown>0)STATE.attackCooldown-=dt;
if(STATE.transformCooldown>0)STATE.transformCooldown-=dt;
// Movement
const alien=player.userData.alien;
const speed=alien.speed;
if(STATE.moveDir.x||STATE.moveDir.z){
const mag=Math.sqrt(STATE.moveDir.x**2+STATE.moveDir.z**2);
const nx=STATE.moveDir.x/mag;
const nz=STATE.moveDir.z/mag;
player.position.x+=nx*speed*dt;
player.position.z+=nz*speed*dt;
// Clamp to arena
player.position.x=Math.max(-48,Math.min(48,player.position.x));
player.position.z=Math.max(-48,Math.min(48,player.position.z));
// Rotate player
const angle=Math.atan2(STATE.moveDir.x,STATE.moveDir.z);
player.rotation.y=angle;
}
// Jump
if(STATE.isJumping){
STATE.velY-=15*dt;
STATE.posY+=STATE.velY*dt;
if(STATE.posY<=0){
STATE.posY=0;STATE.isJumping=false;STATE.velY=0;
}
}
player.position.y=STATE.posY;
// Camera follow
const camX=player.position.x;
const camZ=player.position.z+15;
camera.position.x+=(camX-camera.position.x)*0.1;
camera.position.z+=(camZ-camera.position.z)*0.1;
camera.position.y=12;
camera.lookAt(player.position.x,2,player.position.z);
// Pulse omnitrix
const omniBtn=document.getElementById('omni-btn');
if(STATE.transformCooldown>0){
omniBtn.style.opacity='0.5';
}else{
omniBtn.style.opacity='1';
}
// Update systems
updateEnemies(dt);
updateProjectiles(dt);
updateParticles(dt);
renderer.render(scene,camera);
}

// ============ GAME OVER ============
function gameOver(){
STATE.playing=false;
STATE.alive=false;
STATE.gameOver=true;
const go=document.getElementById('game-over');
document.getElementById('go-stats').innerHTML='Waves: '+STATE.wave+'<br>Score: '+STATE.score.toLocaleString()+'<br>Best Alien: '+(ALIENS[Math.max(0,STATE.alienIndex)].name);
go.classList.add('show');
}

// ============ INIT ============
function startGame(){
STATE.playing=true;STATE.alive=true;STATE.gameOver=false;
STATE.score=0;STATE.wave=1;STATE.hp=100;STATE.maxHp=100;
STATE.alienIndex=-1;STATE.aliensUnlocked=1;STATE.posY=0;
enemies.forEach(e=>scene.remove(e));
enemies=[];
projectiles.forEach(p=>scene.remove(p));
projectiles=[];
particles.forEach(p=>{if(p.mesh)scene.remove(p.mesh)});
particles=[];
player.position.set(0,0,0);
createPlayer();
updateHUD();
document.getElementById('start-screen').classList.add('hidden');
document.getElementById('game-over').classList.remove('show');
document.getElementById('hud').style.display='block';
document.getElementById('controls').style.display='block';
spawnWave();
}

// ============ LOAD ============
window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

// Progressive loading
let loadProgress=0;
const loadInterval=setInterval(()=>{
loadProgress+=15;
document.getElementById('load-bar').style.width=loadProgress+'%';
if(loadProgress>=100){
clearInterval(loadInterval);
setTimeout(()=>{
document.getElementById('loading').classList.add('hidden');
},300);
}
},100);

initThree();
gameLoop();

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('retry-btn').addEventListener('click',startGame);
</script>
</body>
